services:
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"

  # 6-node Valkey Cluster (3 masters + 3 replicas) on ports 7000-7005,
  # all inside one container so the nodes can reach each other on 127.0.0.1
  # (which is also what they announce, so host clients can follow redirects).
  valkey-cluster:
    image: valkey/valkey:8
    ports:
      - "7000-7005:7000-7005"
    command:
      - sh
      - -c
      - |
        for port in 7000 7001 7002 7003 7004 7005; do
          valkey-server --port $$port --cluster-enabled yes --cluster-config-file /tmp/nodes-$$port.conf --cluster-announce-ip 127.0.0.1 --appendonly no --save "" --daemonize yes
        done
        sleep 3
        valkey-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 --cluster-replicas 1 --cluster-yes
        tail -f /dev/null