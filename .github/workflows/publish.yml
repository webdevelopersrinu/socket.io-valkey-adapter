name: Publish to npm

# Runs automatically when you publish a GitHub Release.
# It builds, tests against a real Valkey server, then publishes to npm
# using the NPM_TOKEN secret stored in the repository settings.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
