name: Publish to npm

# Runs automatically when you publish a GitHub Release.
# It builds, tests against a real Valkey server, then publishes to npm
# using the NPM_TOKEN secret stored in the repository settings.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Valkey (standalone + cluster)
        run: docker compose up -d

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Wait for cluster to be ready
        run: |
          for i in $(seq 1 30); do
            state=$(docker compose exec -T valkey-cluster valkey-cli -p 7000 cluster info 2>/dev/null | grep cluster_state || true)
            echo "$state"
            if echo "$state" | grep -q "cluster_state:ok"; then exit 0; fi
            sleep 2
          done
          echo "cluster did not become ready" && exit 1

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VALKEY_TOKEN }}
